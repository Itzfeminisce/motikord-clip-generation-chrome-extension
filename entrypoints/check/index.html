<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motikord machine check</title>
    <style>
      body { font: 14px/1.45 system-ui, sans-serif; margin: 24px; max-width: 1000px; color: #111; background: #fff; }
      table { border-collapse: collapse; width: 100%; margin: 16px 0; }
      th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
      td.lines { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
      .Pass { color: #0a6b2d; font-weight: 600; } .Fail { color: #b00020; font-weight: 600; }
      .Slow, .running { color: #8a5a00; font-weight: 600; }
      #status { margin: 8px 0; min-height: 1.4em; }
      canvas { width: 100%; max-width: 960px; background: #000; display: block; }
    </style>
  </head>
  <body>
    <h1>Motikord machine check</h1>
    <p>Press Run all, wait until every test shows Pass, Slow or Fail, then press Copy results.</p>
    <button id="all" type="button">Run all</button>
    <button id="copy" type="button">Copy results</button>
    <div id="status" role="status"></div>
    <canvas id="preview" width="1280" height="720"></canvas>
    <table>
      <thead><tr><th>Test</th><th>Run</th><th>Result</th><th>Numbers</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <h2>Machine</h2>
    <table><tbody id="machine"></tbody></table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
